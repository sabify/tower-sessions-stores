[package]
name = "tower-sessions-redis-store"
description = "Redis session store for `tower-sessions`."
version = "0.16.0"
edition = "2021"
authors = ["Max Countryman <hello@maxcountryman.com>"]
license = "MIT"
homepage = "https://github.com/maxcountryman/tower-sessions-stores"
keywords = ["axum", "sessions", "cookie", "tower", "redis"]
categories = ["asynchronous", "network-programming", "web-programming"]
repository = "https://github.com/maxcountryman/tower-sessions-stores"
documentation = "https://docs.rs/tower-sessions-redis-store"
readme = "README.md"

[dependencies]
async-trait = "0.1.92"
redis = { version = "1.7", features = ["tokio-comp"] }
rmp-serde = "1.3"
thiserror = "2.0"
time = "0.3.55"
tower-sessions-core = { version = "0.15.0", git = "https://github.com/sabify/tower-sessions" }

[dev-dependencies]
axum = "0.8.9"
tower-sessions = { version = "0.15.0", git = "https://github.com/sabify/tower-sessions" }
tokio = { version = "1.53", features = ["full"] }
tokio-test = "0.4.5"
serde = "1.0"

[features]
# Enable `fred` TLS support via native-tls
enable-native-tls = ["redis/tokio-native-tls-comp"]
# Enable `fred` TLS support via rustls with the default crypto backend features
enable-rustls = ["redis/tokio-rustls-comp", "redis/tls-rustls-webpki-roots"]
connection-manager = ["redis/connection-manager"]

[[example]]
name = "redis"
