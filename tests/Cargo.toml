[package]
name = "tests"
version = "0.1.0"
edition = "2021"
publish = false

[dev-dependencies]
axum = "0.8.9"
http = "1.5"
http-body-util = "0.1"
hyper = "1.11"
time = "0.3.55"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-cookies = "0.11.0"
tower-sessions = { version = "0.15.0", git = "https://github.com/sabify/tower-sessions" }
tower-sessions-sqlx-store = { path = "../sqlx-store/", features = [
  "sqlite",
  "mysql",
  "postgres",
] }
tower-sessions-redis-store = { path = "../redis-store/" }
tower-sessions-mongodb-store = { path = "../mongodb-store/" }
tower-sessions-moka-store = { path = "../moka-store/" }

[[test]]
name = "test_integration"
path = "test-integration.rs"
